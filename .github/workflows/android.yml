name: 安卓 APK

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 打包时要用和 App 里相同版本的 Python 来装依赖、编译 .pyc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 固定的正式签名（存在仓库的 Actions Secret 里），新版 APK 才能直接覆盖安装旧版
      - name: 准备签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::没有配置 ANDROID_KEYSTORE_B64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: 构建 APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --stacktrace

      - name: 检查签名
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: 重命名
        run: cp android/app/build/outputs/apk/release/app-release.apk MijiaDashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MijiaDashboard-apk
          path: MijiaDashboard.apk
