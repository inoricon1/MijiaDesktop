name: 安卓 APK

on:
  push:
    branches: [main]
    paths: ["android/**", "app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Chaquopy 打包时要用和 App 里相同版本的 Python 来装依赖、编译 .pyc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 缓存调试签名：每次构建签名一致，新版 APK 才能直接覆盖安装旧版
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: 构建 APK
        run: gradle -p android assembleRelease --stacktrace

      - name: 重命名
        run: cp android/app/build/outputs/apk/release/app-release.apk MijiaDashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MijiaDashboard-apk
          path: MijiaDashboard.apk
