<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>米家桌面版</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<section id="login" class="hidden">
  <div class="login-card">
    <h1>米家桌面版</h1>
    <p>打开米家 App，扫码登录</p>
    <div class="qr-box" id="qr"><span style="color:#999">正在获取二维码…</span></div>
    <p id="login-msg">请用米家 App 扫码</p>
    <p class="login-tip">登录凭证只保存在本机，有效期约 30 天，到期前会自动续期。</p>
    <div style="margin-top:16px"><button class="btn" id="login-retry">刷新二维码</button></div>
  </div>
</section>

<section id="app" class="hidden">
  <aside>
    <div class="brand"><div class="logo"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></div>米家桌面版</div>
    <select class="home-select" id="home-select"></select>
    <div id="rooms"></div>
    <div class="aside-foot" id="last-update"></div>
  </aside>
  <main>
    <header>
      <h2 id="title">全部设备</h2>
      <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" placeholder="搜索设备"></label>
      <button class="icon-btn" id="btn-refresh" title="刷新"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg></button>
      <button class="icon-btn hide-in-widget" id="btn-top" title="窗口置顶"><svg class="i" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l-1 6 4 3v2H6v-2l4-3z"/></svg></button>
      <button class="icon-btn" id="btn-widget" title="小组件模式（只显示收藏，缩小并置顶）"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
      <button class="icon-btn hide-in-widget" id="btn-settings" title="设置"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </header>
    <div id="content">
      <div class="scenes" id="scenes"></div>
      <div class="filters" id="filters"></div>
      <div id="devices"></div>
    </div>
  </main>
</section>

<div id="mask" class="hidden"></div>
<div id="drawer">
  <div class="d-head">
    <div class="dev-ico" id="d-ico"></div>
    <div class="meta"><h3 id="d-name"></h3><div class="dev-sub" id="d-sub"></div></div>
    <button class="icon-btn" id="d-fav" title="收藏"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>
    <button class="icon-btn" id="d-close" title="关闭"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="d-body" id="d-body"></div>
</div>

<div class="modal hidden" id="settings">
  <div class="modal-card">
    <h3>设置</h3>
    <div class="row"><div class="lbl"><div>刷新间隔</div><div class="hint">传感器数据和历史记录的采样频率</div></div>
      <select class="sel" id="set-poll"><option value="30">30 秒</option><option value="60">1 分钟</option><option value="120">2 分钟</option><option value="300">5 分钟</option></select></div>
    <div class="row"><div class="lbl"><div>外观</div></div>
      <select class="sel" id="set-theme"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
    <div class="row col"><div class="top"><div class="lbl"><div>青萍物联</div><div class="hint" id="qp-hint">在青萍开发者平台「个人中心 → 权限管理」申请 App Key 和 App Secret 后填在这里</div></div></div>
      <div class="qp-form"><input class="txt" id="qp-key" placeholder="App Key" autocomplete="off"><input class="txt" id="qp-secret" type="password" placeholder="App Secret" autocomplete="off"><button class="btn" id="qp-save">连接</button></div></div>
    <div class="row"><div class="lbl"><div>显示全部属性</div><div class="hint">包括调试信息、只有英文名、不方便在桌面上设置的项目</div></div>
      <button class="toggle" id="set-all"></button></div>
    <div class="row"><div class="lbl"><div>已隐藏设备</div><div class="hint" id="hidden-hint"></div></div>
      <button class="btn" id="set-unhide">全部恢复</button></div>
    <div class="row"><div class="lbl"><div>账号</div><div class="hint">退出后需重新扫码</div></div>
      <button class="btn danger" id="set-logout">退出登录</button></div>
    <div class="modal-foot"><button class="btn" id="set-close">完成</button></div>
  </div>
</div>

<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
